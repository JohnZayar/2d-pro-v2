<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0f17">
<title>2D Agent Pro v2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ LINK SCREEN (first run) ============ -->
<div id="linkScreen" class="screen">
    <div class="link-card">
        <div class="app-logo">🎯</div>
        <h1 class="app-title">2D Agent Pro</h1>
        <p class="app-subtitle">v2 • Local-first</p>
        <p class="link-desc">Main ရဲ့ Link Code နဲ့ ချိတ်ဆက်ပါ</p>

        <label class="field-label" for="tenantCodeInput">Link Code</label>
        <input type="text" id="tenantCodeInput" class="field-input" placeholder="Main ပေးတဲ့ code ရိုက်ထည့်ပါ" autocomplete="off" autocapitalize="off">

        <label class="field-label" for="agentNameInput">နာမည်</label>
        <input type="text" id="agentNameInput" class="field-input" placeholder="ကိုယ့်နာမည်" autocomplete="off">

        <button id="connectBtn" class="btn-primary" onclick="connectAgent()">ချိတ်ဆက်မည်</button>
        <p id="linkError" class="error-msg" hidden></p>
    </div>
</div>

<!-- ============ MAIN APP SCREEN ============ -->
<div id="appScreen" class="screen" hidden>
    <header class="app-header">
        <div class="header-left">
            <div class="agent-name" id="headerAgentName">—</div>
            <div class="tenant-name" id="headerTenantName">—</div>
        </div>
        <div class="header-right">
            <span id="syncPill" class="sync-pill" title="Sync status">⚪</span>
            <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
        </div>
    </header>

    <main class="app-main">
        <!-- Current session banner -->
        <div id="sessionBanner" class="session-banner">
            <span id="sessionBannerText">Session ရွေးနေတယ်…</span>
        </div>

        <!-- Big action: open digital board -->
        <button id="openBoardBtn" class="btn-board" onclick="openBoard()">
            📝 စာရင်းသွင်းရန် <span class="btn-sub">နှိပ်၍ ဘုတ်ဖွင့်မည်</span>
        </button>

        <!-- Records -->
        <div class="section-head">
            <h2>📋 ကျွန်တော့် စာရင်း</h2>
            <span id="recordCount" class="count-badge">0</span>
        </div>
        <div id="recordsList" class="records-list"></div>
        <div id="recordsEmpty" class="empty-state" hidden>
            စာရင်း မရှိသေးပါ<br><span>အပေါ် ခလုတ်နှိပ်၍ စသွင်းပါ</span>
        </div>

        <!-- Totals -->
        <div class="totals-bar">
            <div class="total-item">
                <span class="total-label">စုစုပေါင်း</span>
                <span class="total-value" id="totalAmount">0</span>
            </div>
            <div class="total-item">
                <span class="total-label">အကွက်</span>
                <span class="total-value" id="totalCount">0</span>
            </div>
        </div>
    </main>
</div>

<!-- ============ DIGITAL BOARD MODAL ============ -->
<div id="boardModal" class="modal" hidden>
    <div class="board-card">
        <div class="board-title">
            <span>📝 ဒစ်ဂျစ်တယ် ဘုတ်</span>
            <span class="close-x" onclick="closeBoard()">✕</span>
        </div>

        <div class="board-textarea-wrap">
            <textarea id="boardTextarea" class="board-textarea" placeholder="ဥပမာ:&#10;12=500&#10;34r 1000&#10;6ထိပ် 7000&#10;ဒါမှမဟုတ် paste လုပ်ပါ…"></textarea>
        </div>

        <div id="boardPreview" class="board-preview" hidden></div>

        <div class="board-btns">
            <button class="btn-back" onclick="closeBoard()">Back</button>
            <button class="btn-paste" onclick="pasteToBoard()">Paste</button>
            <button class="btn-save" onclick="saveBoard()">💾 Save</button>
        </div>
    </div>
</div>

<!-- ============ SETTINGS MODAL ============ -->
<div id="settingsModal" class="modal" hidden>
    <div class="settings-card">
        <div class="board-title">
            <span>⚙️ Settings</span>
            <span class="close-x" onclick="closeSettings()">✕</span>
        </div>
        <div class="settings-row">
            <span>Link Code</span>
            <b id="settingsTenantCode">—</b>
        </div>
        <div class="settings-row">
            <span>နာမည်</span>
            <b id="settingsAgentName">—</b>
        </div>
        <div class="settings-row">
            <span>Sync</span>
            <b id="settingsSyncState">—</b>
        </div>
        <button class="btn-danger-outline" onclick="syncNowManual()">🔄 အခု Sync လုပ်မည်</button>
        <button class="btn-danger-outline" onclick="disconnectAgent()">🚪 ထွက်မည် (unlink)</button>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
