<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Pro v2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0f17;color:#e8ecf3;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
h1{font-size:28px;margin-bottom:8px}
p{color:#8b95a7;margin-bottom:32px;text-align:center}
.btn{display:block;width:280px;max-width:90vw;padding:18px;margin:12px;border-radius:14px;text-align:center;text-decoration:none;font-size:18px;font-weight:700;transition:transform .1s}
.btn:active{transform:scale(.97)}
.master{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff}
.agent{background:linear-gradient(135deg,#059669,#047857);color:#fff}
.ver{margin-top:32px;color:#5b6577;font-size:13px}
</style>
</head>
<body>
<h1>🎯 2D Pro v2</h1>
<p>PocketBase + Local-first<br>ရွေးချယ်ပါ</p>
<a class="btn master" href="./master/">📊 2D Master Pro</a>
<a class="btn agent" href="./agent/">📱 2D Agent Pro</a>
<div class="ver">v2.0 — PocketBase + Local-first</div>
</body>
</html>
